# One origin for the whole product (plan section 10): the web app is served here and /api, /hubs, /mcp, /webhooks and
# /health go to the API container. No CORS, no second certificate; the reverse proxy in front terminates TLS.
# STOREASY_API_UPSTREAM is filled from the environment by the nginx image's envsubst step (default http://storeasy-api:8080).

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Store keys are uploaded as text inside a JSON body (at most 16 KB); anything else the app sends is small.
    client_max_body_size 1m;

    include /etc/nginx/snippets/security-headers.conf;

    # REST API.
    location /api/ {
        proxy_pass ${STOREASY_API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SignalR (live activity): WebSocket upgrade, long-lived connections, no buffering.
    location /hubs/ {
        proxy_pass ${STOREASY_API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Remote MCP (streamable HTTP): responses stream, so no buffering.
    location /mcp {
        proxy_pass ${STOREASY_API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # Store and CI webhooks (App Store Connect, signed events, EAS and artifact pushes) and the health probes. The API
    # also answers these under /api/webhooks; the short paths are what the docs hand out.
    location /webhooks/ {
        proxy_pass ${STOREASY_API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health/ {
        proxy_pass ${STOREASY_API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: every unknown path serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html always revalidates, so a deploy is picked up at once and never points at deleted chunks.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # Long-cache hashed assets.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
