# Release on a `v*` tag (container images are built by images.yml on the same tag):
# - GitHub release with generated notes;
# - the moving major tag (for example `v0`) that `Milvasoft/storeasy/tools/upload-action@v0` users follow;
# - the npm package `storeasy` (CLI and the local MCP bridge) through npm trusted publishing (GitHub OIDC, provenance,
#   no stored token; the package has a trusted publisher for this repository and release.yml);
# - the Azure DevOps extension (StoreasyUpload@1) under the `milvasoft` Marketplace publisher, through Marketplace
#   trusted publishing (GitHub OIDC, no stored token; the publisher has a policy for this repository and release.yml).
# A manual run (workflow_dispatch) with an existing tag publishes npm and the extension again for that tag only.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish to npm and the Marketplace again (for example v0.1.2)
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  TAG: ${{ inputs.tag || github.ref_name }}
  # Marketplace publisher id; passed to tfx as well, so a manual run for an older tag publishes under it too.
  MARKETPLACE_PUBLISHER: milvasoft

jobs:
  tools:
    name: tools (test and build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: npm ci
        working-directory: tools
      - run: npm run lint
        working-directory: tools
      - run: npm test
        working-directory: tools
      - run: npm run build
        working-directory: tools

  github:
    name: GitHub release and action tag
    needs: tools
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease=""
          case "$TAG" in v0.*|*-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" --verify-tag --generate-notes --title "storeasy $TAG" $prerelease
      - name: Move the major tag
        run: |
          major="${TAG%%.*}"
          git tag -f "$major" "$GITHUB_SHA"
          git push -f origin "refs/tags/$major"

  npm:
    name: npm (storeasy)
    needs: tools
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: npm ci
        working-directory: tools
      - run: npm run build -w storeasy-cli
        working-directory: tools
      - name: Set the package version from the tag
        working-directory: tools/storeasy-cli
        run: npm version "${TAG#v}" --no-git-tag-version --allow-same-version
      - name: npm with trusted publishing support (11.5.1 or later)
        run: npm install -g npm@11.21.3
      - name: Publish (npm trusted publishing)
        working-directory: tools/storeasy-cli
        run: npm publish --access public

  azure-devops:
    name: Azure DevOps extension
    needs: tools
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Publish (Marketplace trusted publishing)
        working-directory: tools/azure-devops-task
        run: |
          # A GitHub OIDC token for the Marketplace audience, exchanged for a 15 minute publish credential
          # (the exchange `vsce publish --oidc` does; tfx-cli has no OIDC option yet). Nothing is stored.
          oidc=$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=marketplace.visualstudio.com" | jq -r .value)
          echo "::add-mask::$oidc"
          credential=$(curl -fsS -X POST \
            -H "Authorization: FederatedToken $oidc" -H 'Content-Type: application/json' -H 'Accept: application/json' \
            -d "{\"publisherName\":\"$MARKETPLACE_PUBLISHER\"}" \
            'https://marketplace.visualstudio.com/_apis/gallery/token?api-version=7.2-preview.1' | jq -r .credential)
          if [ -z "$credential" ] || [ "$credential" = "null" ]; then
            echo "::error title=Marketplace trusted publishing::The OIDC token exchange returned no credential."
            exit 1
          fi
          echo "::add-mask::$credential"
          npx --yes tfx-cli@0.24.2 extension publish --manifest-globs vss-extension.json \
            --override "{\"version\": \"${TAG#v}\"}" --publisher "$MARKETPLACE_PUBLISHER" \
            --token "$credential" --no-prompt
