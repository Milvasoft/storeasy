# Dependency updates: minor and patch only, grouped per ecosystem to keep the pull request count low. Major updates are
# ignored here and done by hand when a release plan calls for them (they need code changes and a full test run).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: nuget
    directory: /storeasy-api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nuget-minor:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /storeasy-app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      web-minor:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /tools
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      tools-minor:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: docker
    directories: [/storeasy-api, /storeasy-app]
    schedule:
      interval: weekly
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: docker-compose
    directories: [/deploy, /storeasy-api]
    schedule:
      interval: weekly
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
