# Local development dependencies: docker compose up -d
# Redis is required (cache, token revocation stamps, feature flags, rate limits). The application reads it from
# Milvasoft:Caching:Redis:ConnectionString, whose default (localhost:6379) points at the service below.
# PostgreSql is optional: point ConnectionStrings:DefaultConnectionString at it
# (Host=localhost;Port=5432;Database=<your database>;Username=postgres;Password=postgres) or use your own server.
# Seq is optional: the log sink of MILVA_ENV=test and prod; set SeqUri to http://localhost:5341 to use it (UI on the same url).
# SeaweedFS is the local S3 (Storage:S3 in appsettings.Development.json): S3 API on http://localhost:8333 (path style),
# master UI on http://localhost:9333. Its S3 credentials come from seaweedfs/s3.json (local only values, never use them
# elsewhere). seaweedfs-init creates the storeasy-local bucket. The web app (http://localhost:5173) uploads to presigned
# URLs from the browser: -s3.allowedOrigins lets that origin through CORS, and SeaweedFS exposes the ETag header of the
# multipart part uploads on its own (checked with 4.51).
services:
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  seq:
    image: datalust/seq:2024.3
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "5341:80"
    volumes:
      - seq-data:/data

  seaweedfs:
    image: chrislusf/seaweedfs:4.51
    restart: unless-stopped
    command: server -s3 -s3.config=/etc/seaweedfs/s3.json -s3.allowedOrigins=http://localhost:5173 -dir=/data
    ports:
      - "8333:8333"
      - "9333:9333"
    volumes:
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
      - seaweedfs-data:/data

  seaweedfs-init:
    image: chrislusf/seaweedfs:4.51
    depends_on:
      - seaweedfs
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      until echo 's3.bucket.list' | weed shell -master=seaweedfs:9333 -filer=seaweedfs:8888 | grep -q storeasy-local; do
      echo 's3.bucket.create -name storeasy-local' | weed shell -master=seaweedfs:9333 -filer=seaweedfs:8888;
      sleep 2;
      done;
      exit 0;
      "

volumes:
  redis-data:
  postgres-data:
  seq-data:
  seaweedfs-data:
