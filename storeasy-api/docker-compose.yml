# Local development dependencies: docker compose up -d
# Redis is required (cache, token revocation stamps, feature flags, rate limits). The application reads it from
# Milvasoft:Caching:Redis:ConnectionString, whose default (localhost:6379) points at the service below.
# PostgreSql is optional: point ConnectionStrings:DefaultConnectionString at it
# (Host=localhost;Port=5432;Database=<your database>;Username=postgres;Password=postgres) or use your own server.
# Seq is optional: the log sink of MILVA_ENV=test and prod; set SeqUri to http://localhost:5341 to use it (UI on the same url).
# MinIO is the local S3 (Storage:S3 in appsettings.Development.json): API on http://localhost:9000, console on
# http://localhost:9001, user/password minioadmin (local only). minio-init creates the storeasy-local bucket.
# MinIO no longer publishes images on Docker Hub; pgsty/minio and pgsty/mc are community builds of the same releases.
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  seq:
    image: datalust/seq:2024.3
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "5341:80"
    volumes:
      - seq-data:/data

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: pgsty/mc:RELEASE.2026-11-12T00-00-00Z
    depends_on:
      - minio
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/storeasy-local;
      exit 0;
      "

volumes:
  redis-data:
  postgres-data:
  seq-data:
  minio-data:
