# Milvasoft hosting (storeasy.milvasoft.com): Azure DevOps builds the two linux/arm64 images on the hq-oci agent.
# The agent shares the server's Docker daemon, so Dokploy uses the images from there (pull_policy: never); nothing is
# pushed to a registry. Tests run in GitHub Actions (.github/workflows/ci.yml), not here.
# When this run succeeds, CD-storeasy (azure-pipeline-cd.yml) starts on its own.
trigger:
  batch: true
  branches:
    include:
      - master
  paths:
    exclude:
      - docs/*
      - '*.md'
pr: none

pool:
  name: Hq-docker-agent
  demands:
    - Agent.Name -equals HQ-AZURE-AGENT

steps:
  - task: Bash@3
    displayName: Build storeasy-api (linux/arm64)
    inputs:
      targetType: inline
      script: |
        set -e
        docker build -f storeasy-api/Dockerfile \
          --build-arg STOREASY_COMMIT="$(git rev-parse --short HEAD)" \
          -t milvasoft/storeasy-api:test -t milvasoft/storeasy-api:test-$(Build.BuildId) .

  - task: Bash@3
    displayName: Build storeasy-web (linux/arm64)
    inputs:
      targetType: inline
      script: |
        set -e
        docker build -f storeasy-app/Dockerfile \
          --build-arg VITE_APP_VERSION="$(git rev-parse --short HEAD)" \
          --build-arg VITE_SOURCE_URL=https://github.com/Milvasoft/storeasy \
          -t milvasoft/storeasy-web:test -t milvasoft/storeasy-web:test-$(Build.BuildId) storeasy-app
