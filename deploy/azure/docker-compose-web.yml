# Milvasoft hosting: the web app (nginx) behind Traefik at storeasy.milvasoft.com; proxies /api, /hubs, /mcp,
# /webhooks and /health to storeasy-api.
services:
  storeasy-web:
    container_name: storeasy-web
    image: milvasoft/storeasy-web:test
    restart: unless-stopped
    pull_policy: never
    env_file:
      - .env
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    networks:
      - container-network

networks:
  container-network:
    name: container-network
    external: true
