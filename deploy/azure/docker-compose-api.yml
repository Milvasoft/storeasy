# Milvasoft hosting: the API on the shared infrastructure (postgredb, redis, seq on container-network; AWS S3).
# Self-hosters use deploy/docker-compose.yml instead.
services:
  storeasy-api:
    container_name: storeasy-api
    image: milvasoft/storeasy-api:test
    restart: unless-stopped
    pull_policy: never
    env_file:
      - .env
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
    networks:
      - container-network

networks:
  container-network:
    name: container-network
    external: true
